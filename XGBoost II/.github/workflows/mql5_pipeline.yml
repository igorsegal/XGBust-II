name: AHexaTrader MQL5 Edge Miner (старый, только вручную)
on:
  workflow_dispatch:
permissions:
  contents: write
  models: read
jobs:
  mine-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pipeline & generate MQL5 rule stubs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAI_API_KEY: ${{ vars.MAI_API_KEY }}
          MAI_BASE_URL: https://azure.com
          MAI_MODEL: gpt-4.1-mini
        run: |
          python src/main.py
          python src/generate_rules.py
      - name: Commit updated state and rules
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ rules/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update passed_edges and MQL5 rule templates" && git pull --rebase && git push)
