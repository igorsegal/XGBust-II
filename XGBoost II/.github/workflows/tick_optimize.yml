name: Tick Walk-Forward Optimization (Cloud)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/tick_validator_v3.cpp'
      - '.github/workflows/tick_optimize.yml'
permissions:
  contents: write
jobs:
  optimize-ticks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download V3 Quant & Dukascopy Ticks caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/cache
          gh release download cache-v3 -p "v3_quant_HTF.bin" -D data/cache/ --clobber || true
          gh release download ticks-v1 -p "EURUSD_ticks.bin" -D data/cache/ --clobber
          ls -lh data/cache/
      - name: Compile C++20 Multi-Core Tick Optimizer
        run: |
          g++ -O3 -std=c++20 -fopenmp src/tick_validator_v3.cpp -o src/tick_validator_v3
      - name: Run 41.7M Tick Grid Optimization on GitHub Runner
        run: |
          ./src/tick_validator_v3
      - name: Commit Optimization Table to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/tick_opt_results.txt
          git diff --cached --quiet || git commit -m "Cloud tick optimization results (41.7M EURUSD ticks)"
          git push
