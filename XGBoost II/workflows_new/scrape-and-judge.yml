name: Scrape & Judge
# Сбор статей MQL5 (фильтр 1) и жюри (Qwen через DashScope). Лимиты заморожены 2026-11-24:
# 15 статей за запуск, жюри до 20 из очереди, 4 запуска в сутки, паузы 5-15 с, остановка при 403/429/проверке на робота,
# запросы строго по одному. Ключ жюри - секрет репозитория DASHSCOPE_API_KEY.
on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Сколько статей собрать за запуск'
        default: '15'
      jury_limit:
        description: 'Сколько статей из очереди отдать жюри'
        default: '20'
permissions:
  contents: write
concurrency:
  group: scrape-and-judge
  cancel-in-progress: false
jobs:
  scrape-and-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check jury key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::Нет секрета DASHSCOPE_API_KEY: добавьте его в Settings - Secrets and variables - Actions"
            exit 1
          fi
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml
          if [ ! -x /usr/bin/google-chrome ]; then playwright install --with-deps chromium; fi
      - name: Run scraper and jury
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          XGB_BATCH: ${{ github.event.inputs.batch || '15' }}
          JURY_LIMIT: ${{ github.event.inputs.jury_limit || '20' }}
          PYTHONUTF8: '1'
        run: python -u -m src.main
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data ':!data/cache'
          if git diff --cached --quiet; then echo "нечего сохранять"; exit 0; fi
          git commit -m "chore(data): scan update [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          echo "::error::не удалось отправить данные в репозиторий"; exit 1
